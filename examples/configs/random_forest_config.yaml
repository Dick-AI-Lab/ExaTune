experiment:
  name: "random_forest_iris"
  output_dir: "./results/random_forest_iris"
  description: "Random Forest hyperparameter search on Iris dataset"
  tags:
    - "classification"
    - "sklearn"
    - "iris"
  random_seed: 42
  save_models: false
  checkpoint_interval: 100

model:
  type: "sklearn"
  class: "RandomForestClassifier"
  task: "classification"
  fixed_params:
    criterion: "gini"
    bootstrap: true

hyperparameters:
  n_estimators: [10, 50, 100, 200, 300]
  max_depth: [3, 5, 10, 15, 20, null]
  min_samples_split: [2, 5, 10, 20]
  min_samples_leaf: [1, 2, 4, 8]
  max_features: ["sqrt", "log2", null]

dataset:
  name: "iris"
  test_size: 0.2
  validation_size: 0.0
  random_state: 42
  stratify: true

evaluation:
  cv_folds: 5
  cv_strategy: "stratified"
  scoring: "accuracy"
  additional_metrics:
    - "f1_macro"
    - "precision_macro"
    - "recall_macro"
  n_jobs: -1

slurm:
  partition: "compute"
  time: "00:30:00"
  memory: "4G"
  cpus_per_task: 2
  nodes: 1
  account: null
  qos: null
  email: null
  email_type: "FAIL"
  array_size: 50
  additional_directives: {}
