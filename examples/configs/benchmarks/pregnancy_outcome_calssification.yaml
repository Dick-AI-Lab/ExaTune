# ExaTune Configuration: Iris Classification Benchmark
# Dataset: Iris (150 samples, 4 features, 3 classes)
# Task: Multi-class classification
# Model: Random Forest Classifier

experiment:
  name: "pregnancy_outcome_rf_benchmark"
  output_dir: "/scratch/klons06/Exatune/ExaTune/examples/results/benchmarks/pregnancy_outcome/results"
  config: "/scratch/klons06/Exatune/ExaTune/examples/results/benchmarks/pregnancy_outcome/results/config.yaml"
  description: "Random Forest hyperparameter landscape on pregnancy_outcome dataset"
  tags:
    - "benchmark"
    - "classification"
    - "multi-class"
    - "pregnancy_outcome"
    - "sklearn"
  random_seed: 42
  save_models: false
  checkpoint_interval: 50

model:
  type: "sklearn"
  class: "sklearn.ensemble.RandomForestClassifier"
  task: "classification"
  fixed_params:
    criterion: "gini"
    bootstrap: true
    random_state: 42

hyperparameters:
  n_estimators:
    type: "categorical"
    values: [10, 50, 100, 200]
  max_depth:
    type: "categorical"
    values: [3, 5, 10, 15, null]
  min_samples_split:
    type: "categorical"
    values: [2, 5, 10]
  min_samples_leaf:
    type: "categorical"
    values: [1, 2, 4]

dataset:
  name: "pregnancy_outcome"
  path: "/home/klons06/scratch/Exatune/ExaTune/examples/data/pregnancy_outcome_data.csv"
  test_size: 0.2
  random_state: 42
  stratify: true

evaluation:
  cv_folds: 5
  cv_strategy: "stratified"
  scoring: "accuracy"
  additional_metrics:
    - "f1_macro"
    - "f1_micro"
    - "f1_weighted"
    - "precision_macro"
    - "recall_macro"
    - "roc_auc_ovr"
  n_jobs: 1  # Per-job parallelism (set to 1 for SLURM)

slurm:
  time: "00:30:00"
  memory: "4G"
  cpus_per_task: 2
  nodes: 1
  email_type: "FAIL"
  #adding ENV loading  
  python_environment: "/scratch/klons06/Exatune/ENV"
  modules:
    - "gcc/13.3"
    - "python/3.10.13"
    - "scipy-stack/2023b"
    - "arrow/14.0.1"

storage:
  backend: "parquet"
  compress: true
