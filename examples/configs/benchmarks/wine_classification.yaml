# ExaTune Configuration: Wine Classification Benchmark
# Dataset: Wine (178 samples, 13 features, 3 classes)
# Task: Multi-class classification
# Model: Gradient Boosting Classifier

experiment:
  name: "wine_gb_benchmark"
  output_dir: "./results/benchmarks/wine_gb"
  description: "Gradient Boosting hyperparameter landscape on Wine dataset"
  tags:
    - "benchmark"
    - "classification"
    - "multi-class"
    - "wine"
    - "sklearn"
    - "gradient-boosting"
  random_seed: 42
  save_models: false
  checkpoint_interval: 50

model:
  type: "sklearn"
  class_name: "sklearn.ensemble.GradientBoostingClassifier"
  task: "classification"
  fixed_params:
    random_state: 42

hyperparameters:
  n_estimators:
    type: "categorical"
    values: [50, 100, 150, 200, 300]
  learning_rate:
    type: "categorical"
    values: [0.001, 0.01, 0.05, 0.1, 0.2, 0.5]
  max_depth:
    type: "categorical"
    values: [1, 2, 3, 4, 5, 7]
  min_samples_split:
    type: "categorical"
    values: [2, 5, 10, 20]
  min_samples_leaf:
    type: "categorical"
    values: [1, 2, 4, 8]
  subsample:
    type: "categorical"
    values: [0.5, 0.7, 0.8, 0.9, 1.0]

dataset:
  name: "wine"
  test_size: 0.2
  random_state: 42
  stratify: true

evaluation:
  cv_folds: 5
  cv_strategy: "stratified"
  scoring: "accuracy"
  additional_metrics:
    - "f1_macro"
    - "precision_macro"
    - "recall_macro"
    - "roc_auc_ovr"
  n_jobs: 1

slurm:
 # partition: "compute"
  time: "01:30:00"
  memory: "8G"
  cpus_per_task: 2
  nodes: 1
  email_type: "FAIL"
  modules:
    - "gcc/11.3.0"
    - "python/3.10"
    - "scipy-stack/2023b"
    - "arrow/14.0.1"

storage:
  backend: "parquet"
  compress: true
