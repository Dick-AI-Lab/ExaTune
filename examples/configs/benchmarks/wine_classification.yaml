# ExaTune Configuration: Wine Classification Benchmark
# Dataset: Wine (178 samples, 13 features, 3 classes)
# Task: Multi-class classification
# Model: Gradient Boosting Classifier

experiment:
  name: "wine_gb_benchmark"
  output_dir: "/scratch/klons06/Exatune/ExaTune/examples/results/benchmarks/wine_gb/results"
  config: "/scratch/klons06/Exatune/ExaTune/examples/results/benchmarks/wine_gb/results/config.yaml"
  description: "Gradient Boosting hyperparameter landscape on Wine dataset"
  tags:
    - "benchmark"
    - "classification"
    - "multi-class"
    - "wine"
    - "sklearn"
    - "gradient-boosting"
  random_seed: 42
  save_models: false
  checkpoint_interval: 50

model:
  type: "sklearn"
  class_name: "sklearn.ensemble.GradientBoostingClassifier"
  task: "classification"
  fixed_params:
    random_state: 42

hyperparameters:

  n_estimators: [50, 150, 300]
  learning_rate: [0.01, 0.1, 0.5]
  max_depth: [1, 3, 5]
  min_samples_split: [2, 5, 10]
  min_samples_leaf: [1, 2,  ]
  subsample: [0.5, 0.8, 1.0]

dataset:
  name: "wine"
  test_size: 0.2
  random_state: 42
  stratify: true

evaluation:
  cv_folds: 5
  cv_strategy: "stratified"
  scoring: "accuracy"
  additional_metrics:
    - "f1_macro"
    - "precision_macro"
    - "recall_macro"
    - "roc_auc_ovr"
  n_jobs: 1

slurm:
 # partition: "compute"
  time: "01:30:00"
  memory: "8G"
  cpus_per_task: 2
  nodes: 1
  email_type: "FAIL"
  modules:
    - "gcc/11.3.0"
    - "python/3.10"
    - "scipy-stack/2023b"
    - "arrow/14.0.1"

storage:
  backend: "parquet"
  compress: true
