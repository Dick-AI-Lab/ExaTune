# ExaTune Configuration: Breast Cancer Classification Benchmark
# Dataset: Breast Cancer Wisconsin (569 samples, 30 features, 2 classes)
# Task: Binary classification
# Model: XGBoost Classifier

experiment:
  name: "breast_cancer_xgb_benchmark"
  output_dir: "./results/benchmarks/breast_cancer_xgb"
  description: "XGBoost hyperparameter landscape on Breast Cancer dataset"
  tags:
    - "benchmark"
    - "classification"
    - "binary"
    - "breast-cancer"
    - "xgboost"
    - "medical"
  random_seed: 42
  save_models: false
  checkpoint_interval: 100

model:
  type: "xgboost"
  task: "classification"
  fixed_params:
    objective: "binary:logistic"
    eval_metric: "logloss"
    random_state: 42
    tree_method: "auto"

hyperparameters:
  n_estimators:
    type: "discrete"
    values: [50, 100, 200, 300, 500]
  learning_rate:
    type: "discrete"
    values: [0.001, 0.01, 0.05, 0.1, 0.2, 0.3]
  max_depth:
    type: "discrete"
    values: [3, 4, 5, 6, 7, 8, 10]
  min_child_weight:
    type: "discrete"
    values: [1, 3, 5, 7, 10]
  subsample:
    type: "discrete"
    values: [0.5, 0.6, 0.7, 0.8, 0.9, 1.0]
  colsample_bytree:
    type: "discrete"
    values: [0.5, 0.6, 0.7, 0.8, 0.9, 1.0]
  gamma:
    type: "discrete"
    values: [0, 0.1, 0.2, 0.5, 1.0]
  reg_alpha:
    type: "discrete"
    values: [0, 0.01, 0.1, 0.5, 1.0]
  reg_lambda:
    type: "discrete"
    values: [0.1, 0.5, 1.0, 2.0, 5.0]

dataset:
  name: "breast_cancer"
  test_size: 0.2
  random_state: 42
  stratify: true

evaluation:
  cv_folds: 5
  cv_strategy: "stratified"
  scoring: "roc_auc"
  additional_metrics:
    - "accuracy"
    - "f1"
    - "precision"
    - "recall"
    - "average_precision"
  n_jobs: 1

slurm:
  partition: "compute"
  time: "02:00:00"
  memory: "8G"
  cpus_per_task: 2
  nodes: 1
  email_type: "FAIL"

storage:
  backend: "parquet"
  compress: true
