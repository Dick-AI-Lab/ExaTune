# ExaTune Configuration: Iris Classification Benchmark
# Dataset: Iris (150 samples, 4 features, 3 classes)
# Task: Multi-class classification
# Model: Random Forest Classifier

experiment:
  name: "testing_iris_rf_benchmark"
  output_dir: "./results/benchmarks/testing_iris_rf"
  description: "Random Forest hyperparameter landscape on Iris dataset, trying to get only 12 to run properly"
  tags:
    - "benchmark"
    - "classification"
    - "multi-class"
    - "iris"
    - "sklearn"
  random_seed: 42
  save_models: false
  checkpoint_interval: 50

model:
  type: "sklearn"
  class_name: "sklearn.ensemble.RandomForestClassifier"
  task: "classification"
  fixed_params:
    criterion: "gini"
    bootstrap: true
    random_state: 42

hyperparameters:
  n_estimators: [10, 100, 300]
  max_depth: [3, 5, 10, null]

dataset:
  name: "iris"
  test_size: 0.2
  random_state: 42
  stratify: true

evaluation:
  cv_folds: 5
  cv_strategy: "stratified"
  scoring: "accuracy"
  additional_metrics:
    - "f1_macro"
    - "f1_micro"
    - "f1_weighted"
    - "precision_macro"
    - "recall_macro"
    - "roc_auc_ovr"
  n_jobs: 1  # Per-job parallelism (set to 1 for SLURM)

slurm:
  time: "00:30:00"
  memory: "4G"
  cpus_per_task: 2
  nodes: 1
  email_type: "FAIL"
  python_environment: "/scratch/klons06/Exatune/ENV"
  config: "/scratch/klons06/Exatune/ExaTune/examples/results/benchmarks/testing_iris_rf/config.yaml"
  output_dir: "/scratch/klons06/Exatune/ExaTune/examples/results/benchmarks/testing_iris_rf/results"
  modules:
    - "gcc/11.3.0"
    - "python/3.10"
    - "scipy-stack/2023b"
    - "arrow/14.0.1"

storage:
  backend: "parquet"
  compress: true

