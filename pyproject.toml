[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exatune"
version = "0.2.0"
description = "Exhaustive hyperparameter landscape exploration via HPC for machine learning models"
readme = "README.md"
authors = [
    {name = "Katie Lonsway", email = "katie.lonsway@bornontario.ca"},
    {name = "Kevin Dick", email = "kevin.dick@bornontario.ca"},
]
maintainers = [
    {name = "Kevin Dick", email = "kevin.dick@bornontario.ca"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: System :: Distributed Computing",
]
keywords = [
    "hyperparameter-optimization",
    "machine-learning",
    "hpc",
    "slurm",
    "landscape-analysis",
    "visualization",
    "scikit-learn",
    "xgboost",
]
requires-python = ">=3.8"
dependencies = [
    "scikit-learn>=1.0.0",
    "xgboost>=1.5.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "pyarrow>=6.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.0.0",
    "joblib>=1.1.0",
    "click>=8.0.0",
    "rich>=10.0.0",
    "tqdm>=4.60.0",
    "matplotlib>=3.4.0",
]

[project.optional-dependencies]
viz = [
    "plotly>=5.0.0",
    "bokeh>=2.4.0",
    "umap-learn>=0.5.0",
    "seaborn>=0.11.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=2.5.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "pre-commit>=2.17.0",
    "ipython>=8.0.0",
    "ipdb>=0.13.0",
]
docs = [
    "sphinx>=4.5.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.18.0",
    "myst-parser>=0.17.0",
    "sphinx-click>=4.0.0",
]
all = [
    "exatune[viz,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/BORN-Ontario/exatune"
Documentation = "https://exatune.readthedocs.io"
Repository = "https://github.com/BORN-Ontario/exatune"
Issues = "https://github.com/BORN-Ontario/exatune/issues"

[project.scripts]
exatune = "exatune.cli.main:cli"

[tool.setuptools.packages.find]
include = ["exatune*"]

[tool.setuptools.package-data]
exatune = ["hpc/templates/*.sh", "py.typed"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=exatune --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: marks tests as unit tests (default)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "hpc: marks tests that require HPC/SLURM environment",
]

[tool.coverage.run]
source = ["exatune"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
